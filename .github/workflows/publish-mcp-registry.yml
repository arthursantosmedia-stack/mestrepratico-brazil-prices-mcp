name: Publish to Official Anthropic MCP Registry

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Validate server manifest
        run: ./mcp-publisher validate

      - name: Publish server to Anthropic MCP Registry
        run: |
          OUTPUT=$(./mcp-publisher publish 2>&1) || {
            if echo "$OUTPUT" | grep -q "cannot publish duplicate version"; then
              echo "ℹ️ Versão já publicada anteriormente no registro oficial. Nenhuma ação necessária."
              exit 0
            else
              echo "$OUTPUT"
              exit 1
            fi
          }
          echo "$OUTPUT"
